<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memo Internal K-24</title>
<meta name="theme-color" content="#00a547">
<meta name="description" content="Memo internal, persetujuan, dan pembayaran Apotek K-24.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#00a547;font-family:"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#00a547;color:#fff;transition:opacity .35s}
  #splash img{width:180px;max-width:60vw;height:auto;border-radius:12px}
  #splash .spin{width:34px;height:34px;border:4px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
  #splash p{margin:0;font-size:14px;opacity:.9;text-align:center;padding:0 24px}
  #splash button{display:none;border:0;background:#fff;color:#00803a;font-weight:700;padding:10px 18px;border-radius:10px;font-size:14px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="splash">
  <img src="icons/icon-512.png" alt="Apotek K-24">
  <div class="spin" id="spin"></div>
  <p id="msg">Membuka Memo Internal…</p>
  <button id="retry" type="button">Coba lagi</button>
</div>
<iframe id="app" title="Memo Internal K-24" allow="clipboard-write; fullscreen"></iframe>
<script>
  /* =====================================================================
     GANTI ALAMAT DI BAWAH dengan link aplikasi web Anda (berakhiran /exec)
     ===================================================================== */
  var APP_URL = 'https://script.google.com/macros/s/AKfycbyrzDyoHEkUIY869u_LKlTi2y8M9aw7-RShtPiBJMPIYxgY0B6ISvAz0QhnisvqO1_qIg/exec';

  var f = document.getElementById('app'), sp = document.getElementById('splash');
  var msg = document.getElementById('msg'), retry = document.getElementById('retry'), spin = document.getElementById('spin');
  function fail(t){ msg.textContent = t; spin.style.display = 'none'; retry.style.display = 'block'; sp.classList.remove('hide'); }
  function open(){
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(APP_URL)) return fail('Alamat aplikasi belum diatur. Isi APP_URL di file index.html.');
    if (!navigator.onLine) return fail('Tidak ada koneksi internet. Periksa data seluler atau Wi-Fi, lalu coba lagi.');
    spin.style.display = ''; retry.style.display = 'none'; msg.textContent = 'Membuka Memo Internal…';
    f.src = APP_URL + (location.search || '');      // ?k=TOKEN untuk link PSA ikut diteruskan
  }
  f.addEventListener('load', function(){ if (f.src) setTimeout(function(){ sp.classList.add('hide'); }, 300); });
  retry.onclick = open;
  window.addEventListener('online', function(){ if (!sp.classList.contains('hide')) open(); });
  open();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
